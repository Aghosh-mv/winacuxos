source /boot/grub/config.cfg

set default=0
set timeout=10

# WinacuxOS live desktop
@LINUX_LIVE@

# WinacuxOS live desktop, failsafe (basic graphics)
menuentry "WinacuxOS live system (failsafe)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE_FAILSAFE@
	initrd @INITRD_LIVE@
}

# Safe Mode / recovery: boots the same image into diagnostics instead of the
# desktop. See /usr/local/bin/wcx doctor and winacux-recovery.service.
menuentry "WinacuxOS Recovery (diagnostics)" --hotkey=r {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ winacux.recovery=1
	initrd @INITRD_LIVE@
}

submenu 'Advanced options' {
	menuentry "WinacuxOS live system (verbose boot)" {
		linux @KERNEL_LIVE@ @APPEND_LIVE@ systemd.show_status=1
		initrd @INITRD_LIVE@
	}
	menuentry "UEFI Firmware Settings" --hotkey=f {
		fwsetup
	}
}